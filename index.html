<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- Declare our own color scheme so the browser (esp. Chrome's OS-driven
         "auto dark mode for web content") doesn't re-darken/invert this already
         dark, self-themed app. The app controls the actual scheme per theme. -->
    <meta name="color-scheme" content="dark light" />

    <title>PurePlay — Free Music Streaming, Ad-Free</title>
    <meta name="description" content="PurePlay is a fast, privacy-respecting music streaming platform offering ad-free playback, social listening rooms, offline downloads and smart playlists." />
    <meta name="keywords" content="pureplay music, free music streaming, ad-free music, offline music app, collaborative listening rooms, smart playlist" />
    <meta name="author" content="PurePlay" />

    <!-- Open Graph -->
    <meta property="og:title" content="PurePlay — Free Music Streaming, Ad-Free" />
    <meta property="og:description" content="Enjoy unlimited free music streaming on PurePlay. No ads, just music, favorites, playlists, unlimited skips." />
    <meta property="og:type" content="music.song" />
    <meta property="og:url" content="https://pure-play-pearl.vercel.app/" />

    <!-- Mobile / PWA -->
    <meta name="theme-color" content="#070708" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- Google Fonts: Inter + Montserrat + Caveat + Dancing Script -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Dancing+Script:wght@700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:wght@400..900&display=swap"
      rel="stylesheet"
    />

    <!-- Splash screen (hidden once React mounts) -->
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: #070708;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }
      #splash.hidden {
        opacity: 0;
        visibility: hidden;
      }
      #splash .logo {
        font-size: 3.5rem;
        animation: pulse-logo 1.5s ease-in-out infinite;
      }
      #splash .name {
        margin-top: 12px;
        font-family: 'Caveat', 'Dancing Script', cursive;
        font-size: 2.25rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        color: #ffffff;
        text-shadow: 0 4px 20px rgba(255, 107, 74, 0.4);
      }
      #splash .loader {
        margin-top: 24px;
        width: 40px;
        height: 40px;
        border: 3px solid #232329;
        border-top-color: #ff6b4a;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes pulse-logo {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(1.08); opacity: 0.8; }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash .logo { animation: none; }
        #splash .loader { animation-duration: 2.4s; }
      }
    </style>
  </head>
  <body>
    <!-- Splash -->
    <div id="splash" role="status" aria-label="Loading PurePlay">
      <span class="logo" aria-hidden="true">🎧</span>
      <span class="name">PurePlay</span>
      <div class="loader" aria-hidden="true"></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Hide splash once React renders -->
    <script>
      (function () {
        var splash = document.getElementById('splash');
        var root = document.getElementById('root');
        if (!splash || !root) return;

        function dismiss() {
          splash.classList.add('hidden');
          setTimeout(function () {
            splash.remove();
          }, 500);
        }

        var observer = new MutationObserver(function () {
          if (root.childNodes.length > 0) {
            observer.disconnect();
            clearTimeout(failsafe);
            dismiss();
          }
        });
        observer.observe(root, { childList: true });

        var failsafe = setTimeout(function () {
          observer.disconnect();
          dismiss();
        }, 10000);
      })();
    </script>

    <!-- Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "PurePlay",
        "url": "https://pure-play-pearl.vercel.app/",
        "applicationCategory": "MusicApplication",
        "operatingSystem": "Web",
        "description": "Fast, ad-free music streaming with offline downloads, synced listening rooms and smart playlists."
      }
    </script>
  </body>
</html>
